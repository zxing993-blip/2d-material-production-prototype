<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2D 素材生产 · 生产任务</title>
  <link rel="stylesheet" href="../cloud-blue-b2b/tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v14H5V6a2 2 0 0 1 2-2Z"/><path d="M9 9h6M9 13h6M9 17h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/><circle cx="12" cy="12" r="9"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m4 17 5-5 4 4 2-2 5 4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M5 14v5h14v-5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.5 5.2L19 9l-5.5 1.8L12 16l-1.5-5.2L5 9l5.5-1.8L12 2Z"/><path d="m19 15 .7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 8h18c0-1-3-1-3-8Z"/><path d="M10 21h4"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><span class="brand-mark">W</span><span>具身资产管理系统</span></div>
      <nav class="nav">
        <button class="nav-group"><svg><use href="#i-grid"/></svg><span>Gen2Sim</span><svg class="chev"><use href="#i-chevron"/></svg></button>
        <button class="nav-group"><svg><use href="#i-grid"/></svg><span>Scan2Sim</span><svg class="chev"><use href="#i-chevron"/></svg></button>
        <section class="nav-section open">
          <button class="nav-group active-group"><svg><use href="#i-spark"/></svg><span>2D 素材生产</span><svg class="chev rotate"><use href="#i-chevron"/></svg></button>
          <div class="subnav">
            <button class="subnav-item active"><svg><use href="#i-task"/></svg><span>生产任务</span></button>
            <a class="subnav-item" href="quality.html"><svg><use href="#i-check"/></svg><span>质检工作台</span><span class="nav-count">12</span></a>
            <a class="subnav-item" href="library.html"><svg><use href="#i-image"/></svg><span>2D 素材库</span></a>
          </div>
        </section>
        <button class="nav-group"><svg><use href="#i-grid"/></svg><span>数字模仓</span><svg class="chev"><use href="#i-chevron"/></svg></button>
        <button class="nav-group"><svg><use href="#i-grid"/></svg><span>模型管理</span><svg class="chev"><use href="#i-chevron"/></svg></button>
        <button class="nav-group"><svg><use href="#i-grid"/></svg><span>账户管理</span><svg class="chev"><use href="#i-chevron"/></svg></button>
      </nav>
      <div class="sidebar-foot"><div class="avatar">陈</div><div><strong>陈建模</strong><span>建模师</span></div><button aria-label="更多账户操作"><svg><use href="#i-more"/></svg></button></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="breadcrumb"><span>2D 素材生产</span><svg><use href="#i-chevron"/></svg><strong>生产任务</strong></div>
        <div class="top-actions"><button class="icon-btn" aria-label="通知"><svg><use href="#i-bell"/></svg><span class="notice-dot"></span></button><div class="top-avatar">陈</div></div>
      </header>

      <div class="page">
        <section class="page-heading">
          <div class="page-title-row"><h1>生产任务</h1><p>集中查看原图从上传、AI 初筛到入库的全流程进度。</p></div>
          <button class="primary-btn" id="uploadBtn"><svg><use href="#i-upload"/></svg>批量上传原图</button>
        </section>

        <section class="task-panel">
          <div class="panel-header">
            <div class="panel-title-group"><h2>任务列表</h2><span>数据更新于刚刚</span></div>
            <div class="summary-bar" aria-label="任务概览">
              <span>全部 <strong>26</strong></span><i></i>
              <span class="summary-processing">处理中 <strong>8</strong></span><i></i>
              <span class="summary-pending">待人工 <strong>5</strong></span><i></i>
              <span class="summary-exception">异常 <strong>2</strong></span>
            </div>
          </div>
          <div class="filters">
            <label class="search-box"><svg><use href="#i-search"/></svg><input id="searchInput" type="search" placeholder="搜索任务 ID、物品名称" aria-label="搜索任务"></label>
            <select id="ownerFilter" aria-label="筛选负责人"><option value="all">全部负责人</option><option>陈建模</option><option>林嘉</option><option>王岩</option></select>
            <select id="stageFilter" aria-label="筛选当前阶段"><option value="all">全部当前阶段</option><option>批量上传原图</option><option>AI 初筛</option><option>原图复核</option><option>AI 图生图</option><option>成图质检</option><option>分类/标签/命名</option><option>2D 入库</option><option>已完成</option></select>
            <select id="statusFilter" aria-label="筛选当前状态"><option value="all">全部当前状态</option></select>
            <button class="ghost-btn" id="resetBtn">重置</button><span class="filter-spacer"></span>
            <select id="sortFilter" aria-label="任务排序"><option value="time-desc">更新时间：最新优先</option><option value="time-asc">更新时间：最早优先</option><option value="progress-desc">处理进度：从高到低</option><option value="progress-asc">处理进度：从低到高</option></select>
          </div>

          <div class="table-wrap">
            <table>
              <thead><tr><th>任务 / 物品</th><th>当前阶段</th><th>任务状态</th><th>处理进度</th><th>负责人</th><th>更新时间</th><th>备注</th><th>操作</th></tr></thead>
              <tbody id="taskBody"></tbody>
            </table>
            <div class="empty" id="emptyState"><div class="empty-icon"><svg><use href="#i-search"/></svg></div><h3>没有找到匹配任务</h3><p>调整筛选条件或搜索关键词后再试。</p><button class="ghost-btn" id="emptyReset">清空筛选</button></div>
          </div>
          <footer class="pagination"><span id="resultCount">共 8 条</span><div><button disabled>上一页</button><button class="page-current">1</button><button>2</button><button>3</button><button>下一页</button></div></footer>
        </section>
      </div>
    </main>
  </div>

  <div class="overlay" id="drawerOverlay" hidden></div>
  <aside class="drawer" id="taskDrawer" aria-hidden="true" aria-label="任务详情">
    <header><div><span class="drawer-kicker">任务详情</span><h2 id="drawerTitle">办公椅</h2><code id="drawerId"></code></div><button class="icon-btn" id="drawerClose" aria-label="关闭"><svg><use href="#i-close"/></svg></button></header>
    <div class="drawer-body" id="drawerBody"></div>
    <footer><button class="ghost-btn" id="drawerCancel">关闭</button><button class="primary-btn" id="drawerAction">继续处理</button></footer>
  </aside>

  <div class="modal-overlay" id="uploadModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
      <header><div><span class="drawer-kicker">新生产批次</span><h2 id="uploadTitle">批量上传原图</h2></div><button class="icon-btn modal-close" aria-label="关闭"><svg><use href="#i-close"/></svg></button></header>
      <form id="uploadForm">
        <div class="modal-body upload-form-body">
          <label class="form-field"><span>物品名称 <b>*</b></span><input id="itemName" name="itemName" maxlength="50" placeholder="请输入物品名称" required></label>
          <label class="form-field"><span>备注</span><textarea id="taskRemark" name="taskRemark" maxlength="100" placeholder="可填写用途、重点关注事项等（选填）"></textarea></label>
          <div class="form-field"><span>上传图片文件夹 <b>*</b></span><div class="upload-dropzone"><input id="imageFolder" name="imageFolder" type="file" webkitdirectory directory multiple><svg><use href="#i-upload"/></svg><strong>选择图片文件夹</strong><small>支持 PNG、JPG、JPEG、WEBP；选择后自动检测每张图片是否可用</small><div class="upload-picker-actions"><button type="button" class="ghost-btn" id="chooseFolder">选择文件夹</button></div><div class="upload-check-result empty" id="uploadCount" aria-live="polite">尚未选择文件夹</div></div></div>
        </div>
        <footer><button type="button" class="ghost-btn modal-close">取消</button><button id="submitUpload" type="submit" class="primary-btn" disabled>提交并开始上传</button></footer>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
