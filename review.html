<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原图复核｜具身资产管理系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">W</span><strong>具身资产管理系统</strong></div>
      <nav class="nav" aria-label="主导航">
        <div class="nav-group"><span class="nav-symbol">▦</span><span>Gen2Sim</span><span class="chev">›</span></div>
        <div class="nav-group"><span class="nav-symbol">▦</span><span>Scan2Sim</span><span class="chev">›</span></div>
        <div class="nav-section"><div class="nav-group active-group"><span class="nav-symbol">✦</span><span>2D 素材生产</span><span class="chev">⌄</span></div><div class="subnav"><a class="subnav-item" href="index.html"><span>▣</span>生产任务</a><a class="subnav-item active" href="review.html"><span>◉</span>原图复核</a><button class="subnav-item"><span>▧</span>2D 素材库</button></div></div>
        <div class="nav-group"><span class="nav-symbol">▦</span><span>数字模仓</span><span class="chev">›</span></div>
        <div class="nav-group"><span class="nav-symbol">▦</span><span>模型管理</span><span class="chev">›</span></div>
        <div class="nav-group"><span class="nav-symbol">▦</span><span>账户管理</span><span class="chev">›</span></div>
      </nav>
      <div class="sidebar-foot"><span class="avatar">陈</span><div>陈建模<span>建模师</span></div><button aria-label="更多">•••</button></div>
    </aside>

    <main class="main">
      <header class="topbar"><div class="breadcrumb"><a href="index.html">2D 素材生产</a><span>›</span><a href="index.html">生产任务</a><span>›</span><strong>原图复核</strong></div><div class="top-actions"><button class="icon-btn" aria-label="通知">♧</button><span class="top-avatar">陈</span></div></header>
      <div class="review-page">
        <section class="review-heading"><div><h1>原图复核</h1><p>人工确认 AI 初筛后的候选原图；通过项将进入后续图生图处理。</p></div><a class="ghost-btn" href="index.html">返回生产任务</a></section>

        <section class="review-context" aria-label="当前任务信息"><div><span>物品名称</span><strong>人体工学办公椅</strong></div><div><span>物品类目</span><strong>家具</strong></div><div><span>初筛完成</span><strong>92 张</strong></div><div><span>负责人</span><strong>陈建模</strong></div></section>

        <section class="review-summary" aria-label="复核统计"><span>已通过 <strong id="approvedCount">0</strong></span><i></i><span>已不通过 <strong id="rejectedCount">0</strong></span><i></i><span>未处理 <strong id="pendingCount">12</strong></span><i></i><span class="review-failed">提交失败 <strong id="failedCount">0</strong></span></section>

        <section class="review-panel">
          <div class="review-toolbar"><div class="review-filter-group"><select id="reviewStatusFilter" aria-label="筛选处理状态"><option value="all">全部处理状态</option><option value="pending">未处理</option><option value="approved">已通过</option><option value="rejected">已不通过</option><option value="failed">提交失败</option></select><button class="ghost-btn" id="reviewReset">重置</button></div><div class="review-selection"><span id="selectionInfo">未选择图片</span><button class="ghost-btn" id="batchReject" disabled>批量不通过</button><button class="primary-btn" id="batchApprove" disabled>批量通过</button></div></div>
          <div class="review-grid" id="reviewGrid" aria-label="原图复核列表"></div>
          <footer class="pagination"><span id="reviewResultCount">共 12 张</span><div><button disabled>上一页</button><button class="page-current">1</button><button>2</button><button>下一页</button></div></footer>
        </section>
      </div>
    </main>
  </div>
  <div class="toast" id="reviewToast" role="status"></div>
  <script src="review.js"></script>
</body>
</html>
