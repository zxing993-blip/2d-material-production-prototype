<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图生图聚合配置｜具身资产管理系统</title>
  <link rel="stylesheet" href="../cloud-blue-b2b/tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="config-modal-page">
  <main class="config-modal-backdrop">
    <section class="config-modal" role="dialog" aria-modal="true" aria-labelledby="configTitle">
      <header class="config-modal-header">
        <div><h1 id="configTitle">图生图聚合配置</h1><p>按物品任务、Prompt 模板、目标视角和画幅比例批量创建任务</p></div>
        <a class="config-close" href="quality.html" aria-label="关闭">×</a>
      </header>
      <form id="imageConfigForm">
        <div class="config-dialog-body">
          <div class="config-task-summary"><strong id="configName">人体工学办公椅</strong><span id="configCategory">家具</span><i></i><span>已选生图 <b id="approvedInputCount">8 张</b></span></div>
          <div class="config-modal-grid">
            <label class="config-prompt-field"><span>Prompt 模板 <em>可编辑</em></span><textarea id="promptContent" maxlength="1000">以参考原图的物品主体为基础，保持主体外观、结构、材质与比例一致；生成单一完整物品，背景干净，避免新增无关物体。</textarea><small>模板内容将直接用于本次任务。</small></label>
            <div class="config-side-fields">
              <label class="form-field"><span>模型版本</span><input value="千问图生图 v1.0（默认）" readonly></label>
              <div class="form-field"><span>目标视角 <b>*</b></span><div class="view-options" id="viewOptions"><button type="button" class="active" data-view="主视角">主视角</button><button type="button" data-view="45°">45°</button><button type="button" data-view="俯角">俯角</button></div></div>
              <div class="form-field"><span>画幅比例 <b>*</b></span><div class="view-options" id="ratioOptions"><button type="button" class="active" data-ratio="1:1">1:1</button><button type="button" data-ratio="4:3">4:3</button><button type="button" data-ratio="3:4">3:4</button></div></div>
            </div>
          </div>
        </div>
        <footer class="config-modal-footer"><span id="inputOutputRule">输入 8 张 → 目标输出 8 张 · 1024×1024 · 1:1</span><div><a class="ghost-btn" href="quality.html">取消</a><button type="submit" class="primary-btn">提交图生图任务</button></div></footer>
      </form>
    </section>
  </main>
  <div class="toast" id="configToast" role="status"></div>
  <script src="image-to-image.js"></script>
</body>
</html>
