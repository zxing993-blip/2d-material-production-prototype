<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>质检工作台｜具身资产管理系统</title>
  <link rel="stylesheet" href="../cloud-blue-b2b/tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v14H5V6a2 2 0 0 1 2-2Z"/><path d="M9 9h6M9 13h6M9 17h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/><circle cx="12" cy="12" r="9"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m4 17 5-5 4 4 2-2 5 4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.5 5.2L19 9l-5.5 1.8L12 16l-1.5-5.2L5 9l5.5-1.8L12 2Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 8h18c0-1-3-1-3-8Z"/><path d="M10 21h4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><span class="brand-mark">W</span><span>具身资产管理系统</span></div>
      <nav class="nav"><button class="nav-group"><svg><use href="#i-grid"/></svg><span>Gen2Sim</span><svg class="chev"><use href="#i-chevron"/></svg></button><button class="nav-group"><svg><use href="#i-grid"/></svg><span>Scan2Sim</span><svg class="chev"><use href="#i-chevron"/></svg></button><section class="nav-section open"><button class="nav-group active-group"><svg><use href="#i-spark"/></svg><span>2D 素材生产</span><svg class="chev rotate"><use href="#i-chevron"/></svg></button><div class="subnav"><a class="subnav-item" href="index.html"><svg><use href="#i-task"/></svg><span>生产任务</span></a><a class="subnav-item active" href="quality.html"><svg><use href="#i-check"/></svg><span>质检工作台</span><span class="nav-count">12</span></a><a class="subnav-item" href="library.html"><svg><use href="#i-image"/></svg><span>2D 素材库</span></a></div></section><button class="nav-group"><svg><use href="#i-grid"/></svg><span>数字模仓</span><svg class="chev"><use href="#i-chevron"/></svg></button><button class="nav-group"><svg><use href="#i-grid"/></svg><span>模型管理</span><svg class="chev"><use href="#i-chevron"/></svg></button><button class="nav-group"><svg><use href="#i-grid"/></svg><span>账户管理</span><svg class="chev"><use href="#i-chevron"/></svg></button></nav>
      <div class="sidebar-foot"><div class="avatar">陈</div><div><strong>陈建模</strong><span>建模师</span></div><button aria-label="更多账户操作"><svg><use href="#i-more"/></svg></button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb"><span>2D 素材生产</span><svg><use href="#i-chevron"/></svg><strong>质检工作台</strong></div><div class="top-actions"><button class="icon-btn" aria-label="通知"><svg><use href="#i-bell"/></svg><span class="notice-dot"></span></button><div class="top-avatar">陈</div></div></header>
      <div class="review-page quality-page">
        <section class="review-heading"><div><h1>质检工作台</h1><p>集中处理原图复核与成图质检的人工待办。</p></div><a class="ghost-btn" href="index.html">返回生产任务</a></section>
        <div class="quality-tabs" role="tablist"><button class="active" type="button" data-tab="source" role="tab">原图复核 <span>12</span></button><button type="button" data-tab="generated" role="tab">成图质检 <span>8</span></button></div>

        <section class="quality-pane active" data-pane="source">
          <section class="review-summary" aria-label="复核统计"><span>已通过 <strong id="approvedCount">0</strong></span><i></i><span>已不通过 <strong id="rejectedCount">0</strong></span><i></i><span>未处理 <strong id="pendingCount">12</strong></span></section>
          <section class="review-panel"><div class="review-toolbar"><div class="review-filter-group"><label class="review-search"><svg><use href="#i-search"/></svg><input id="reviewSearch" type="search" placeholder="搜索物品名称" aria-label="搜索物品名称"></label><select id="reviewStatusFilter" aria-label="筛选处理状态"><option value="all">全部处理状态</option><option value="pending">未处理</option><option value="approved">已通过</option><option value="rejected">已不通过</option></select><select id="reviewOwnerFilter" aria-label="筛选负责人"><option value="all">全部负责人</option><option>陈建模</option><option>林嘉</option><option>王岩</option></select><button class="ghost-btn" id="reviewReset">重置</button></div></div><div class="review-grid" id="reviewGrid" aria-label="原图复核列表"></div><footer class="pagination"><span id="reviewResultCount">共 12 张</span><div><button disabled>上一页</button><button class="page-current">1</button><button>2</button><button>下一页</button></div></footer></section>
        </section>

        <section class="quality-pane" data-pane="generated">
          <section class="review-summary" aria-label="成图质检统计"><span>已通过 <strong id="generatedApprovedCount">0</strong></span><i></i><span>已不通过 <strong id="generatedRejectedCount">0</strong></span><i></i><span>未处理 <strong id="generatedPendingCount">8</strong></span></section>
          <section class="review-panel"><div class="review-toolbar"><div class="review-filter-group"><label class="review-search"><svg><use href="#i-search"/></svg><input id="generatedSearch" type="search" placeholder="搜索物品名称" aria-label="搜索物品名称"></label><select id="generatedStatusFilter" aria-label="筛选处理状态"><option value="all">全部处理状态</option><option value="pending">未处理</option><option value="approved">已通过</option><option value="rejected">已不通过</option></select><select id="generatedOwnerFilter" aria-label="筛选负责人"><option value="all">全部负责人</option><option>陈建模</option><option>林嘉</option><option>王岩</option></select><button class="ghost-btn" id="generatedReset">重置</button></div></div><div class="review-grid" id="generatedGrid" aria-label="成图质检列表"></div><footer class="pagination"><span id="generatedResultCount">共 8 张</span><div><button disabled>上一页</button><button class="page-current">1</button><button>2</button><button>下一页</button></div></footer></section>
        </section>
      </div>
    </main>
  </div>
  <div class="modal-overlay" id="inboundModal" hidden><section class="modal inbound-modal" role="dialog" aria-modal="true" aria-labelledby="inboundTitle"><header><div><span class="drawer-kicker">确认入库</span><h2 id="inboundTitle">确认入库</h2></div><button class="icon-btn inbound-close" aria-label="关闭">×</button></header><div class="modal-body"><div class="inbound-summary"><div><span>物品名称</span><strong id="inboundName">人体工学办公椅</strong></div><div><span>质检通过成图</span><strong id="inboundCount">0 张</strong></div><div><span>入库规则</span><strong>一图一 Asset ID</strong></div></div><p>确认后将创建正式 2D Asset，并保留来源任务和图生图链路。</p></div><footer><button class="ghost-btn inbound-close">取消</button><button class="primary-btn" id="inboundConfirm">确认入库</button></footer></section></div>
  <div class="toast" id="reviewToast" role="status"></div>
  <script src="review.js"></script>
  <script src="generated-review.js"></script>
  <script src="quality.js"></script>
</body>
</html>
